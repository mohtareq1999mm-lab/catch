; =============================================================================
; Laravel Queue Worker - high  (customer-facing, time-critical)
; -----------------------------------------------------------------------------
; Jobs: SendPasswordResetEmailJob, SendFrontendWebhookJob, GenerateInvoiceListener,
;       OneTimePasswordNotification
; Semantic queue: high → physical name via $QUEUE_HIGH (default: high)
; Spec: 1 worker, tries=5, timeout=1300, sleep=1, memory=512
; Contract: worker timeout (1300) > job timeout (1200) > retry_after (1800) ensures no duplicate release
; =============================================================================
[program:laravel-worker-catch-high]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html
command=bash -c 'exec /usr/local/bin/php /var/www/html/artisan queue:work database --queue="${QUEUE_HIGH:-high}" --tries=5 --timeout=1300 --sleep=1 --memory=512 --max-jobs=500 --max-time=3600'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-catch-high.log
stopwaitsecs=1400
