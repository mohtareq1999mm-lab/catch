; =============================================================================
; Laravel Queue Worker - meem-medium  (background / long-running)
; -----------------------------------------------------------------------------
; Jobs: GenerateInvoicePdfJob, LogActivityJob, PaymentReconciliationJob,
;       all ShouldQueue listeners and notifications, imports/exports
; Spec: 1 worker, tries=3, timeout=1300, sleep=3, memory=512 (raised for Excel)
; Contract: worker timeout (1300) > job timeout (1200) > p99 runtime (~600s 10k)
;           retry_after (1800) > worker timeout, stopwaitsecs (1400) > worker timeout
; =============================================================================
[program:laravel-worker-meem-medium]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html
command=/usr/local/bin/php /var/www/html/artisan queue:work database --queue=meem-medium --tries=3 --timeout=1300 --sleep=3 --memory=512 --max-jobs=500 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-meem-medium.log
stopwaitsecs=1400
