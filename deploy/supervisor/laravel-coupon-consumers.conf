; Coupon Distribution RabbitMQ consumers (meem).
; One program per work queue. Consumers are bounded restarts:
; --max-seconds forces periodic exit so deploys/supervisor rotate workers.
; Logs to the Laravel log channel via stdout/stderr capture.
; Adjust user= to the deploy user. Requires `coupon:rabbitmq-setup` once per env.

[program:meem-coupon-distribution]
process_name=%(program_name)s
command=php /var/www/meem/artisan coupon:consume --queue=distribution --max-seconds=3600
directory=/var/www/meem
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/meem/storage/logs/coupon-distribution-consumer.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production"

[program:meem-coupon-evaluation]
process_name=%(program_name)s
command=php /var/www/meem/artisan coupon:consume --queue=evaluation --max-seconds=3600
directory=/var/www/meem
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/meem/storage/logs/coupon-evaluation-consumer.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production"

[program:meem-coupon-notifications]
process_name=%(program_name)s
command=php /var/www/meem/artisan coupon:consume --queue=notifications --max-seconds=3600
directory=/var/www/meem
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/meem/storage/logs/coupon-notifications-consumer.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production"

; Outbox publisher sweep is scheduler-driven (coupons:publish-outbox every
; minute) plus an immediate after-commit database-queue job — no supervisor
; program needed. Existing database queue workers are untouched.
