; =============================================================================
; Laravel Web Server — managed by Supervisor
; -----------------------------------------------------------------------------
; Ensures the web process is supervised alongside queue workers. Supervisor
; (PID 1) handles SIGTERM/SIGINT and restarts each program via autorestart.
; =============================================================================
[program:laravel-web]
process_name=%(program_name)s
directory=/var/www/html
command=/usr/local/bin/php /var/www/html/artisan serve --host=0.0.0.0 --port=%(ENV_PORT)s
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/web.log
environment=PORT="%(ENV_PORT)s"
stopwaitsecs=30
