; =============================================================================
; Laravel Queue Worker - meem-high  (customer-facing, time-critical)
; -----------------------------------------------------------------------------
; Jobs: SendPasswordResetEmailJob, SendFrontendWebhookJob, GenerateInvoiceListener,
;       OneTimePasswordNotification
; Spec: 1 worker, tries=5, timeout=1300, sleep=1, memory=512
; Contract: worker timeout (1300) > job timeout (1200) > retry_after (1800) ensures no duplicate release
; =============================================================================
[program:laravel-worker-meem-high]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html
command=/usr/local/bin/php /var/www/html/artisan queue:work database --queue=meem-high --tries=5 --timeout=1300 --sleep=1 --memory=512 --max-jobs=500 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-meem-high.log
stopwaitsecs=1400
