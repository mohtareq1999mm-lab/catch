; =============================================================================
; Supervisor daemon configuration for the ChawkBazar / Marvel API container
; -----------------------------------------------------------------------------
; Supervisor manages Queue Workers ONLY. The Scheduler runs via Cron:
;   * * * * * cd /var/www/html && php artisan schedule:run >> /dev/null 2>&1
;
; Programs (one per queue):
;   laravel-worker-meem-high.conf     (1 worker, tries=5, timeout=1300)
;   laravel-worker-meem-medium.conf   (1 worker, tries=3, timeout=1300)
;
; Deploy: copy deploy/supervisor/*.conf into /etc/supervisor/conf.d/
; Then run: supervisorctl reread && supervisorctl update
; =============================================================================

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700
chown=www:www

[supervisord]
logfile=/var/www/html/storage/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
nodaemon=true
minfds=1024
minprocs=200
childlogdir=/var/www/html/storage/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
