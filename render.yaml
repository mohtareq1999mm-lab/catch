# =============================================================================
# Render.com Blueprint - ChawkBazar Laravel API
# =============================================================================
# This file enables Infrastructure as Code for Render deployments.
# Place in repository root and connect to Render for auto-configuration.
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # ===========================================================================
  # Laravel API Web Service
  # ===========================================================================
  - type: web
    name: chawkbazar-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    
    # Region - choose closest to your users
    region: frankfurt  # Options: oregon, ohio, virginia, frankfurt, singapore
    
    # Instance type (adjust based on needs)
    plan: starter  # Options: free, starter, standard, pro
    
    # Health check configuration
    healthCheckPath: /api
    
    # Auto-deploy on push to main branch
    autoDeploy: true
    branch: main
    
    # Build-time commands (runs before Dockerfile)
    # buildCommand: ""
    
    # Pre-deploy command (runs after build, before deploy)
    # Useful for migrations without modifying entrypoint
    # preDeployCommand: php artisan migrate --force
    
    # Environment variables
    envVars:
      # =======================================================================
      # Application Core
      # =======================================================================
      - key: APP_NAME
        value: ChawkBazar
      
      - key: APP_ENV
        value: production
      
      - key: APP_DEBUG
        value: "false"
      
      - key: APP_KEY
        sync: false  # Set manually in Render dashboard (secret)
      
      - key: APP_URL
        fromService:
          type: web
          name: chawkbazar-api
          property: host
          # This auto-populates with your Render URL
      
      # =======================================================================
      # Database (TiDB Cloud - MySQL Compatible)
      # =======================================================================
      - key: DB_CONNECTION
        value: mysql
      
      - key: DB_HOST
        sync: false  # Set in Render dashboard
      
      - key: DB_PORT
        value: "4000"  # TiDB default port
      
      - key: DB_DATABASE
        sync: false  # Set in Render dashboard
      
      - key: DB_USERNAME
        sync: false  # Set in Render dashboard
      
      - key: DB_PASSWORD
        sync: false  # Set in Render dashboard
      
      # SSL Certificate for TiDB Cloud
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      
      # TiDB: Pessimistic transaction mode for FOR UPDATE locking
      # Required for coupon claim concurrency (parent-row serialization)
      - key: DB_INIT_COMMAND
        value: "SET SESSION tidb_txn_mode = 'pessimistic'"
      
      # =======================================================================
      # Redis (shared instance - meem-* queue prefix isolates this project)
      # =======================================================================
      - key: REDIS_CLIENT
        value: predis

      - key: REDIS_HOST
        sync: false  # Set in Render dashboard (managed Redis / external host)

      - key: REDIS_PORT
        value: "6379"

      - key: REDIS_PASSWORD
        sync: false  # Set in Render dashboard (secret)

      - key: REDIS_DB
        value: "0"

      - key: REDIS_CACHE_DB
        value: "1"

      - key: CACHE_PREFIX
        value: meem_cache

      - key: REDIS_PREFIX
        value: meem_

      # =======================================================================
      # Cache & Session (Redis)
      # =======================================================================
      - key: CACHE_DRIVER
        value: redis

      - key: SESSION_DRIVER
        value: redis

      - key: QUEUE_CONNECTION
        value: database  # Queued jobs stored in the jobs table, processed by Supervisor workers (meem-high/meem-medium)
      
      # =======================================================================
      # Migration Control
      # =======================================================================
      - key: RUN_MIGRATIONS
        value: "false"  # Set to 'true' for first deploy only
      
      # =======================================================================
      # Logging
      # =======================================================================
      - key: LOG_CHANNEL
        value: stderr  # Sends logs to Render dashboard
      
      - key: LOG_LEVEL
        value: warning

  # ===========================================================================
  # Background Worker — Queue Processing (alternative to in-container Supervisor)
  # ===========================================================================
  # The web container now runs Supervisor (meem-high + meem-medium) via
  # docker-entrypoint.sh. If you prefer Render's native background workers
  # (recommended for larger scale), create two pserv services instead:
  #
  #   - type: pserv
  #     name: meem-worker-high
  #     runtime: docker
  #     dockerfilePath: ./Dockerfile
  #     dockerCommand: php artisan queue:work database --queue=meem-high --tries=5 --timeout=1200 --sleep=1 --memory=256 --max-jobs=1000 --max-time=3600
  #
  #   - type: pserv
  #     name: meem-worker-medium
  #     runtime: docker
  #     dockerfilePath: ./Dockerfile
  #     dockerCommand: php artisan queue:work database --queue=meem-medium --tries=3 --timeout=900 --sleep=3 --memory=256 --max-jobs=1000 --max-time=3600
  #
  # Either model is valid, but do NOT run both simultaneously.

  # ===========================================================================
  # Scheduler — Cron Job (alternative to in-container dcron)
  # ===========================================================================
  # The web image now includes dcron and runs `schedule:run` every minute via
  # `crond` started in docker-entrypoint.sh. If you prefer Render's native
  # cron, uncomment the service below:
  #
  # - type: cron
  #   name: meem-scheduler
  #   runtime: docker
  #   dockerfilePath: ./Dockerfile
  #   dockerCommand: php artisan schedule:run
  #   schedule: "* * * * *"
  #   envVars:
  #     - key: APP_ENV
  #       value: production
  #     # ... (copy DB/Redis vars from web service)

# =============================================================================
# Notes:
# =============================================================================
# 1. After connecting this repo to Render, go to the service dashboard
#    and manually set the 'sync: false' values (secrets).
#
# 2. First deployment:
#    - Set RUN_MIGRATIONS=true or use Render Shell to run:
#      php artisan migrate --force
#      php artisan db:seed --force (if needed)
#
# 3. Generate APP_KEY locally:
#    php artisan key:generate --show
#    Copy the output (base64:xxx...) to Render dashboard.
# =============================================================================
